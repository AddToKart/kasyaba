# Development override, loaded automatically by `docker compose up`.
# Starts a local PostgreSQL, runs migrations once, then runs the API and
# worker from source with hot reload.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kasyaba
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/kasyaba}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@db:5432/kasyaba}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./kasyaba-backend
      dockerfile: Dockerfile.dev
    image: kasyaba-backend:dev
    volumes:
      - ./kasyaba-backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/kasyaba}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@db:5432/kasyaba}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-at-least-32-characters-long}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-500}
    command: sh -c "npx prisma generate && npm run dev"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./kasyaba-backend
      dockerfile: Dockerfile.dev
    image: kasyaba-backend:dev
    volumes:
      - ./kasyaba-backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/kasyaba}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@db:5432/kasyaba}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-at-least-32-characters-long}
      WORKER_TIMEZONE: ${WORKER_TIMEZONE:-Asia/Manila}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL:-500}
    command: npm run dev:worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  backend_node_modules:
