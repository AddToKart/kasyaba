name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'kasyaba-backend/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kasyaba-backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasyaba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: kasyaba-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kasyaba-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasyaba_test

      - name: Run migrations
        run: npx prisma migrate dev
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasyaba_test

      - name: Type check
        run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasyaba_test
          JWT_ACCESS_SECRET: test-secret-at-least-32-characters-long-here

      - name: Run unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasyaba_test
          JWT_ACCESS_SECRET: test-secret-at-least-32-characters-long-here

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasyaba_test
          JWT_ACCESS_SECRET: test-secret-at-least-32-characters-long-here
