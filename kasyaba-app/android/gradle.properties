org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows build-host workaround: the Pub cache lives on C: while this workspace
# builds on D:, so Kotlin's incremental cache cannot relativize plugin sources
# and fails url_launcher_android (and future plugins) with "different roots".
# Disable incremental Kotlin compilation to keep debug/release builds reliable.
# Re-enable if the workspace and Pub cache share a drive.
kotlin.incremental=false
