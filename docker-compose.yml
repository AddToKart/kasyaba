# Production stack: API + worker + one-shot migrations.
# The database is expected to be managed (Supabase/PostgreSQL); for a
# self-contained local stack use the automatically loaded
# docker-compose.override.yml instead (plain `docker compose up`).
#
# Required env (export or place in a root .env file):
#   DATABASE_URL, DIRECT_URL, JWT_ACCESS_SECRET, CORS_ALLOWED_ORIGINS
services:
  migrate:
    build:
      context: ./kasyaba-backend
      dockerfile: Dockerfile
      target: migrate
    image: kasyaba-backend-migrate:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
    restart: "no"

  api:
    build:
      context: ./kasyaba-backend
      dockerfile: Dockerfile
    image: kasyaba-backend:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@kasyaba.app}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: kasyaba-backend:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_TIMEZONE: ${WORKER_TIMEZONE:-Asia/Manila}
      SNAPSHOT_CRON: ${SNAPSHOT_CRON:-10 0 * * *}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: node dist/worker.js
