version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kasyaba
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./kasyaba-backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kasyaba
      DIRECT_URL: postgresql://postgres:postgres@db:5432/kasyaba
      JWT_ACCESS_SECRET: dev-access-secret-at-least-32-characters-long
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  worker:
    build:
      context: ./kasyaba-backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/kasyaba
      DIRECT_URL: postgresql://postgres:postgres@db:5432/kasyaba
      JWT_ACCESS_SECRET: dev-access-secret-at-least-32-characters-long
      LOG_LEVEL: info
      WORKER_TIMEZONE: Asia/Manila
      SNAPSHOT_CRON: "10 0 * * *"
    depends_on:
      db:
        condition: service_healthy
    command: node dist/worker.js

volumes:
  pgdata:
